<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Issues Tracker</title>

 <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<body class="min-h-screen bg-slate-50">
  <nav class="bg-white border-b border-slate-200">
    <div class="w-full px-6 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full text-white flex items-center justify-center"><img src="./assets/github-logo.png" alt=""></div>
        <div class="font-semibold text-2xl text-left text-[#1f2937]">GitHub Issues Tracker</div>
      </div>

      <div class="flex items-center gap-4">
        <input id="searchInput"
               class="rounded-md border border-slate-200 px-2 py-2 outline-none text-sm w-52" placeholder="Search issues..." />
        <button id="newIssueBtn" class="btn btn-primary px-4 py-2 text-base font-semibold">+ New Issue</button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6 rounded-sm">

    <div class="bg-white border border-slate-200 rounded-2xl p-3 flex gap-3 justify-start">
      <button class="tabBtn px-10 py-3 rounded border border-slate-200 text-base font-medium bg-indigo-600 text-white"
              data-tab="all">All</button>
      <button class="tabBtn px-10 py-3 rounded border border-slate-200 text-base font-medium  bg-white"
              data-tab="open">Open</button>
      <button class="tabBtn px-10 py-3 rounded border border-slate-200 text-base font-medium  bg-white"
              data-tab="closed">Closed</button>
    </div>


    <div class="mt-3 bg-white border border-slate-200 rounded-2xl overflow-hidden">
      <div class="p-4 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center">
            <img src="./assets/Aperture.png" alt="">
          </div>

          <div>
            <div id="issueCount" class="font-semibold text-xl text-[#1f2937]">0 Issues</div>
            <div class="text-slate-500 text-sm">Track and manage your project issues</div>
          </div>
        </div>
        <div class="flex items-center gap-3 text-sm text-slate-600 flex-wrap justify-end">
          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-green-600 inline-block font-medium"></span> Open
          </span>
          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-purple-600 inline-block font-medium"></span> Closed
          </span>
        </div>
      </div>


      


</body>
</html>
