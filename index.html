<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl p-8">

        <!-- Header -->
        <div class="flex flex-col items-center text-center mb-6">
            <div class="w-20 h-20 flex items-center justify-center mb-4">
                <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-full h-full object-contain">
            </div>
            <h1 class="font-bold text-2xl text-[#1f2937]">GitHub Issues Tracker</h1>
            <p class="text-sm text-[#64748b] mt-1">Sign in to manage your issues</p>
        </div>


        <form id="loginForm" action="">
            <div class="mb-4">
                <label class="block text-sm font-medium text-[#1f2937] mb-2">Username</label>
                <input id="username"
                       class="w-full rounded-lg border border-slate-200 px-4 py-3 outline-none text-base"
                       placeholder="Enter Username" />
                <p class="text-sm text-[#4a00ff] mt-2">Default: admin</p>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-[#1f2937] mb-2">Password</label>
                <input id="password" type="password"
                       class="w-full rounded-lg border border-slate-200 px-4 py-3 outline-none text-base"
                       placeholder="Enter Password"/>
                <p class="text-sm text-[#4a00ff] mt-1">Default: admin123</p>
            </div>

            <button type="submit" class="btn btn-primary w-full rounded-lg  font-semibold text-base py-6">Sign In</button>

            <p id="error" class="text-sm text-red-600 min-h-[20px] mt-2"></p>
        </form>

        <div class="divider font-regular text-base text-[#1f2937] my-6">OR</div>

        <div class="text-center">
            <p class="text-sm text-slate-400 mt-6 mb-2">Demo Credentials:</p>
            <div class="bg-slate-50 rounded-lg px-5 py-4 text-base text-[#1f2937] text-center mx-auto">
                <p><strong>Username:</strong> admin</p>
                <p class="mt-1"><strong>Password:</strong> admin123</p>
            </div>
        </div>

    </div>

    <script src="./script.js/indes.js"></script>
</body>
</html>
